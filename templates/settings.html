{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Settings</h3>
                </div>
                <div class="card-body">
                    <form>
                        <div class="mb-3">
                            <label for="profile-pic" class="form-label">Profile Picture</label>
                            <input type="file" class="form-control" id="profile-pic">
                        </div>
                        <div class="mb-3">
                            <label for="languages" class="form-label">Languages Spoken</label>
                            <input type="text" class="form-control" id="languages" placeholder="e.g., English, Spanish, French">
                        </div>
                        <div class="mb-3">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea class="form-control" id="bio" rows="3" placeholder="Tell us a little about yourself"></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
